<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#141a22;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#1a263d;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#141a22;stop-opacity:1" />
    </radialGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feOffset result="offOut" in="SourceAlpha" dx="5" dy="5" />
      <feGaussianBlur result="blurOut" in="offOut" stdDeviation="5" />
      <feBlend in="SourceGraphic" in2="blurOut" mode="normal" />
    </filter>
  </defs>
  <rect width="200" height="200" fill="url(#grad1)" filter="url(#shadow)" />
  <text x="50%" y="50%" font-family="Times New Roman" font-size="100" fill="#6b99dc" text-anchor="middle" alignment-baseline="middle" font-weight="bold" filter="url(#shadow)">CR</text>
  
</svg>
